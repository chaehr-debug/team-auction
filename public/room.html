<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀 경매</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <!-- 감독 닉네임 등록 -->
  <div id="register" class="center-screen hidden">
    <form class="card" id="registerForm">
      <h2 id="regTitle">감독 입장</h2>
      <div class="muted" id="regInfo"></div>
      <div class="row" style="gap:14px">
        <div id="regAvatar"></div>
        <button type="button" class="btn btn-sm" id="regImage">🖼 프로필 사진 (선택)</button>
      </div>
      <div class="field">
        <label for="regName">닉네임</label>
        <input class="input" id="regName" maxlength="16" placeholder="방송 닉네임" autocomplete="off" required>
      </div>
      <button class="btn btn-primary btn-lg" type="submit">입장</button>
      <button class="btn hidden" type="button" id="regResume"></button>
      <button class="btn btn-ghost" type="button" id="regWatch">시청만 하기</button>
    </form>
  </div>

  <div id="message" class="center-screen hidden"><div class="card" id="messageText"></div></div>

  <main id="app"></main>

  <script type="module" src="/js/room.js"></script>
</body>
</html>
