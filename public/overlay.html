<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경매 오버레이</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    /* 오버레이 전용 보정 — OBS 1920x1080 기준 */
    body.overlay { overflow: hidden; }
    body.overlay .view { min-height: 0; }
  </style>
</head>
<body class="overlay">
  <main id="app"></main>
  <script type="module">
    // 방송 오버레이 (읽기 전용)
    // 사용 예:
    //   /overlay/ROOM                         기본 (감독 + 현재 경매 + 로그)
    //   /overlay/ROOM?panels=log&bg=transparent  로그만, 투명 배경
    //   /overlay/ROOM?panels=lot,log&layout=layout-overlay   원하는 패널 조합
    //   /overlay/ROOM?panels=cam               감독 캠만 (입찰한 감독 캠)
    //   bg = dark(기본) | transparent | green
    //   sound=0 효과음 끄기 · volume=0.5 전체 음량
    //   (OBS 브라우저 소스에서 '오디오를 OBS로 제어'를 켜면 오버레이 소리를 방송에 섞을 수 있습니다)
    import { connect, syncClock, derive, keepStats } from '/js/common.js';
    import { createRenderer } from '/js/renderer.js';
    import { VIEWS, OVERLAY_DEFAULT } from '/js/views.js';
    import { createSoundPlayer } from '/js/sound.js';
    import { applyBackgrounds } from '/js/bg.js';
    applyBackgrounds();

    const code = location.pathname.split('/').pop().toUpperCase();
    const q = new URLSearchParams(location.search);
    const panels = q.get('panels') ? q.get('panels').split(',') : null;
    const bg = q.get('bg');
    if (bg) document.body.classList.add(`bg-${bg}`);

    const socket = connect(code);
    const sound = createSoundPlayer({ enabled: q.get('sound') !== '0', volume: +(q.get('volume') ?? 1) });
    const renderer = createRenderer(document.getElementById('app'), { onFrame: s => sound.onFrame(s) });
    const onState = s => {
      keepStats(s);
      syncClock(s.serverNow);
      sound.onState(s);
      let names, layout;
      if (panels) {
        names = panels;
        layout = q.get('layout') || (names.length === 1 ? 'layout-overlay-single' : 'layout-overlay');
      } else if (s.phase === 'auction' || s.phase === 'rebid') {
        names = OVERLAY_DEFAULT;
        layout = q.get('layout') || 'layout-overlay';
      } else {
        // 준비/결과 단계는 시청자 화면 그대로
        ({ layout, panels: names } = VIEWS[s.phase].viewer);
      }
      renderer.render({ state: s, d: derive(s), role: 'viewer', me: null, links: {} }, layout, names);
    };
    socket.on('connect', async () => {
      const r = await socket.call('join', { code });
      if (r.ok) onState(r.state);
    });
    socket.on('state', onState);
  </script>
</body>
</html>
