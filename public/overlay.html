<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경매 오버레이</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    /* 오버레이 전용 보정 — OBS 1920x1080 기준 */
    body.overlay { overflow: hidden; }
    body.overlay .view { min-height: 0; }
  </style>
</head>
<body class="overlay">
  <main id="app"></main>
  <script type="module">
    // 로그 오버레이 (읽기 전용) — 방송 화면용 채팅창 형태 경매 로그만 띄운다
    // (감독·현재 경매·캠을 보여주던 방송 오버레이는 폐쇄: 방송은 옵저버 화면으로 진행)
    // 사용 예:
    //   /overlay/ROOM?bg=transparent   로그만, 투명 배경
    //   bg = dark(기본) | transparent | green
    //   sound=0 효과음 끄기 · volume=0.5 전체 음량
    //   (OBS 브라우저 소스에서 '오디오를 OBS로 제어'를 켜면 오버레이 소리를 방송에 섞을 수 있습니다)
    import { connect, syncClock, derive, keepStats } from '/js/common.js';
    import { createRenderer } from '/js/renderer.js';
    import { createSoundPlayer } from '/js/sound.js';
    import { applyBackgrounds } from '/js/bg.js';
    applyBackgrounds();

    const code = location.pathname.split('/').pop().toUpperCase();
    const q = new URLSearchParams(location.search);
    const bg = q.get('bg');
    if (bg) document.body.classList.add(`bg-${bg}`);

    const socket = connect(code);
    const sound = createSoundPlayer({ enabled: q.get('sound') !== '0', volume: +(q.get('volume') ?? 1) });
    const renderer = createRenderer(document.getElementById('app'), { onFrame: s => sound.onFrame(s) });
    const onState = s => {
      keepStats(s);
      syncClock(s.serverNow);
      sound.onState(s);
      renderer.render({ state: s, d: derive(s), role: 'viewer', me: null, links: {} }, 'layout-overlay-single', ['log']);
    };
    socket.on('connect', async () => {
      const r = await socket.call('join', { code });
      if (r.ok) onState(r.state);
    });
    socket.on('state', onState);
  </script>
</body>
</html>
